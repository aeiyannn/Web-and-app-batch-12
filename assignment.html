<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Assignment</title>
</head>

<body>

    <h1>Weekly Class Timetable</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <caption>
            <strong>Weekly Class Timetable</strong>
        </caption>

        <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>

        <tr>
            <td>9:00 - 10:00</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>JavaScript</td>
            <td>React</td>
            <td>Node.js</td>
        </tr>

        <tr>
            <td>10:00 - 11:00</td>
            <td>JavaScript</td>
            <td>HTML</td>
            <td>React</td>
            <td>CSS</td>
            <td>Node.js</td>
        </tr>

        <!-- COLSPAN -->
        <tr>
            <td>11:00 - 12:00</td>
            <td colspan="5">
                <strong>BREAK</strong>
            </td>
        </tr>

        <!-- ROWSPAN -->
        <tr>
            <td>12:00 - 1:00</td>
            <td rowspan="2">
                <strong>LAB</strong>
            </td>
            <td>Lab</td>
            <td>JavaScript</td>
            <td>React</td>
            <td>Project</td>
        </tr>

        <tr>
            <td>1:00 - 2:00</td>
            <td>HTML</td>
            <td>JavaScript</td>
            <td>React</td>
            <td>Project</td>
        </tr>

    </table>

</body>
</html>
